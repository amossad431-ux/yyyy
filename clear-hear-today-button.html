<!-- ===== Clear Hear Today — Shaking button + pointing arrow ===== -->
<!-- الصق الكود ده كامل في بلوك Custom HTML في Shopify -->

<style>
  /* اهتزاز الزرار — بيهتز في أول ~0.8 ثانية وبعدين يستنى (دورة كل 3 ثواني) */
  @keyframes cht-shake {
    0%   { transform: translateX(0) rotate(0); }
    3%   { transform: translateX(-4px) rotate(-1.5deg); }
    6%   { transform: translateX(4px)  rotate(1.5deg);  }
    9%   { transform: translateX(-4px) rotate(-1.5deg); }
    12%  { transform: translateX(4px)  rotate(1.5deg);  }
    15%  { transform: translateX(-3px) rotate(-1deg);   }
    18%  { transform: translateX(3px)  rotate(1deg);    }
    21%  { transform: translateX(-2px) rotate(0);       }
    24%  { transform: translateX(2px)  rotate(0);       }
    27%  { transform: translateX(-1px) rotate(0);       }
    30%, 100% { transform: translateX(0) rotate(0); }
  }

  /* نبضة خفيفة مع الاهتزاز (كل 3 ثواني برضه) */
  @keyframes cht-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(30,144,255,0.45); }
    15%  { box-shadow: 0 0 0 12px rgba(30,144,255,0); }
    30%, 100% { box-shadow: 0 0 0 0 rgba(30,144,255,0); }
  }

  /* حركة السهم (بيتحرك ناحية الزرار) */
  @keyframes cht-arrow {
    0%, 100% { transform: translateX(0); opacity: 1; }
    50%      { transform: translateX(10px); opacity: 0.6; }
  }

  .cht-wrap {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin: 30px auto;
  }

  .cht-arrow {
    font-size: 2em;
    color: #1e90ff;
    animation: cht-arrow 1s ease-in-out infinite;
    line-height: 1;
    user-select: none;
  }

  .cht-btn {
    display: inline-block;
    background: #1e90ff;
    color: #fff;
    font-size: 1.2em;
    font-weight: bold;
    padding: 15px 40px;
    border-radius: 8px;
    text-decoration: none;
    font-family: Georgia, serif;
    cursor: pointer;
    border: none;
    animation: cht-shake 3s ease-in-out infinite, cht-pulse 3s ease-in-out infinite;
    transform-origin: center;
  }

  /* يقف الاهتزاز لما الماوس يقف عليه عشان يبقى مريح للضغط */
  .cht-btn:hover {
    animation-play-state: paused;
    background: #0f7ae0;
  }

  /* يحترم إعداد تقليل الحركة لأصحاب الحساسية للحركة */
  @media (prefers-reduced-motion: reduce) {
    .cht-btn, .cht-arrow { animation: none; }
  }
</style>

<div style="text-align:center; margin:30px 0;">
  <span class="cht-wrap">
    <span class="cht-arrow" aria-hidden="true">👉</span>
    <a href="javascript:void(0)"
       class="cht-btn"
       onclick="var t=document.querySelector('[id*=ProductInformation],[id*=product-information],.product__info-container,product-info');if(!t){var fs=document.querySelectorAll('form[action*=cart]');if(fs.length){t=fs[0];}}if(t){t.scrollIntoView({behavior:'smooth',block:'start'});}">
      Clear Hear Today
    </a>
  </span>
</div>
